# .github/workflows/retrain.yml
name: Scheduled Retraining Pipeline

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 2am UTC
  workflow_dispatch:        # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run retraining pipeline
        run: PYTHONPATH=. python src/pipeline/run_pipeline.py

      - name: Commit new model if promoted
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/xgb_champion.json models/promotion_history.json || true
          git diff --staged --quiet || git commit -m "chore: auto-promote new champion model [skip ci]"
          git push